name: Presenças automáticas (Agenda interna)

# O disparo automático já não é daqui — é do pg_cron do Supabase (job
# "presencas-agenda", ver supabase/migrations/0054): a cada 15 minutos,
# só entre as 07h e as 23h (hora de Portugal). O agendamento do GitHub
# Actions ("*/15") só disparava de ~6 em ~6 horas. Este workflow fica só
# para disparar à mão quando for preciso — botão "Run workflow".
#
# A lógica está na função public.marcar_presencas_agenda (migração
# 0053); o endpoint só a chama, por isso o botão manual e o pg_cron
# fazem exatamente o mesmo.
on:
  workflow_dispatch: {}

jobs:
  chamar-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Marcar presenças dos treinos que terminaram
        run: |
          curl --fail-with-body -sS -L -X GET \
            "${{ secrets.APP_URL }}/api/cron/presencas-agenda" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
