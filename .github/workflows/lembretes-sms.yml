name: Lembretes de treino por SMS

# O disparo diário já não é daqui — é do Cron do Vercel (ver
# vercel.json, "/api/cron/lembretes-sms"), porque o agendamento do
# GitHub Actions falhava em disparar à hora certa sem aviso (aconteceu
# mais do que uma vez, até 8h+ de atraso). Este workflow fica só para
# disparar à mão quando for preciso reenviar com as tentativas
# automáticas — ver botão "workflow_dispatch" ou o de reenvio no
# próprio painel (Lembretes SMS).
#
# Se o telemóvel do SMS Gate estiver offline, a rota devolve
# "gatewayOffline":true — este workflow tenta de novo, até 3 vezes,
# com 1 minuto de intervalo, exatamente como pedido. Ao 3º falhanço
# consecutivo é a própria rota (lib/data/lembretesSms.ts) que regista o
# alerta dentro da app (faixa vermelha + Centro de alertas), não este
# workflow.
on:
  workflow_dispatch: {}

jobs:
  enviar-lembretes:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar lembretes (com retries se o telemóvel estiver offline)
        run: |
          for tentativa in 1 2 3; do
            resposta=$(curl -sS -L -X GET \
              "${{ secrets.APP_URL }}/api/cron/lembretes-sms" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
            echo "Tentativa $tentativa: $resposta"

            offline=$(echo "$resposta" | jq -r '.gatewayOffline // false')
            if [ "$offline" != "true" ]; then
              exit 0
            fi

            if [ "$tentativa" -lt 3 ]; then
              echo "Telemóvel offline — a esperar 1 minuto antes da próxima tentativa…"
              sleep 60
            fi
          done
