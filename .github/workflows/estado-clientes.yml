name: Transição automática de estado dos clientes

# Uma vez por dia: passa a Pendente logo no 1º dia sem pagamento
# válido, e a Inativo quem está há 2 meses (60 dias) ou mais sem
# pagar. Nunca mexe em quem está Suspenso (manual apenas) nem em quem
# teve o estado alterado à mão.
on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch: {}

jobs:
  chamar-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Avaliar e atualizar estados
        run: |
          curl --fail-with-body -sS -L -X GET \
            "${{ secrets.APP_URL }}/api/cron/estado-clientes" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
